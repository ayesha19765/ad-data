name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-validation:
    name: Python Linting & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff -r airflow/requirements.txt

      - name: Compile Python Files
        run: |
          python -m py_compile airflow/dags/*.py

      - name: Run Python Unit Tests
        run: |
          python -m unittest discover tests

      - name: Validate Data Contracts & Schemas
        run: |
          python scripts/validate_contracts.py --strict
          python scripts/check_schema.py --strict
          python scripts/validate_docs.py

      - name: Run Ruff Linter
        run: |
          ruff check .

  sql-lint:
    name: SQLFluff Linting (BigQuery)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install SQLFluff
        run: |
          pip install sqlfluff sqlfluff-templater-dbt

      - name: Lint Ingestion SQL
        run: |
          sqlfluff lint airflow/dags/sql/ --dialect bigquery

  airflow-validation:
    name: Airflow DAG Parsing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Airflow & Providers
        run: |
          pip install apache-airflow==2.8.1 apache-airflow-providers-google -r airflow/requirements.txt

      - name: Validate DAG Parsing
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          GCP_PROJECT_ID: test-gcp-project
          BIGQUERY_DATASET: adaptive_ads_stg
          GCP_GCS_BUCKET: test-gcs-bucket
        run: |
          python -c "
          import sys
          from airflow.models import DagBag
          dagbag = DagBag(dag_folder='airflow/dags', include_examples=False)
          if dagbag.import_errors:
              print('DAG import errors found:', dagbag.import_errors, file=sys.stderr)
              sys.exit(1)
          print(f'Successfully loaded {len(dagbag.dags)} DAGs: {list(dagbag.dags.keys())}')
          "

  dbt-validation:
    name: dbt Project Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install dbt
        run: |
          pip install dbt-core==1.6.0 dbt-bigquery==1.6.0

      - name: Validate dbt Dependencies & Structure
        env:
          GCP_PROJECT_ID: test-gcp-project
          GOOGLE_APPLICATION_CREDENTIALS: /dev/null
        run: |
          cd dbt
          dbt deps

  security-audit:
    name: Secret & Credential Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan for Exposed Credentials
        run: |
          echo "Scanning repository for leaked credential files and private keys..."
          FOUND=0
          if find . -maxdepth 3 -name "*.json" -not -path "./.git/*" -not -path "./airflow/fake_gcs/*" -exec grep -l "private_key" {} + 2>/dev/null; then
            echo "ERROR: Service account private key file detected!"
            FOUND=1
          fi
          if [ -f "airflow/.env" ]; then
            echo "ERROR: Unignored airflow/.env detected!"
            FOUND=1
          fi
          if [ $FOUND -ne 0 ]; then
            exit 1
          fi
          echo "Security scan passed: no exposed credentials found."

