name: 'adaptive_ads'
version: '1.0.0'
config-version: 2

# Profile name in profiles.yml
profile: 'adaptive_ads'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Layer-specific default materialization configurations
models:
  adaptive_ads:
    staging:
      +materialized: view
    core:
      +materialized: table
    marts:
      +materialized: table
