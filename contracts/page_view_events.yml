    type: STRING
    mode: NULLABLE
  - name: city
    type: STRING
    mode: NULLABLE
  - name: state
    type: STRING
    mode: NULLABLE
  - name: userAgent
    type: STRING
    mode: NULLABLE
  - name: lon
