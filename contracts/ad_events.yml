version: 1
dataset: ad_events
owner: "Platform / AdTech Engineering"
description: "Ad impressions, clicks, and interaction telemetry"
target_table: "adaptive_ads_stg.ad_events"
partition:
  field: "ts"
  type: "HOUR"
columns:
  - name: video
    type: STRING
    mode: NULLABLE
  - name: adType
    type: STRING
    mode: NULLABLE
    description: "Ad placement format (pre-roll, mid-roll, etc.)"
  - name: duration
    type: FLOAT64
    mode: NULLABLE
  - name: ts
    type: TIMESTAMP
    mode: NULLABLE
    description: "Event occurrence timestamp in UTC"
  - name: auth
    type: STRING
    mode: NULLABLE
  - name: level
    type: STRING
    mode: NULLABLE
  - name: city
    type: STRING
    mode: NULLABLE
  - name: state
    type: STRING
    mode: NULLABLE
  - name: userAgent
    type: STRING
    mode: NULLABLE
  - name: lon
    type: FLOAT64
    mode: NULLABLE
  - name: lat
    type: FLOAT64
    mode: NULLABLE
  - name: userId
    type: INTEGER
    mode: NULLABLE
  - name: lastName
    type: STRING
    mode: NULLABLE
  - name: firstName
    type: STRING
    mode: NULLABLE
  - name: dateOfBirth
    type: STRING
    mode: NULLABLE
  - name: gender
    type: STRING
    mode: NULLABLE
  - name: registration
    type: INTEGER
    mode: NULLABLE

