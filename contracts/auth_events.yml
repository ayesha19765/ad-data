version: 1
dataset: auth_events
owner: "Platform / Identity & Security Engineering"
description: "User authentication, login, and registration events"
target_table: "adaptive_ads_stg.auth_events"
partition:
  field: "ts"
  type: "HOUR"
columns:
  - name: ts
    type: TIMESTAMP
    mode: NULLABLE
  - name: level
    type: STRING
    mode: NULLABLE
  - name: city
    type: STRING
    mode: NULLABLE
  - name: state
    type: STRING
    mode: NULLABLE
  - name: userAgent
    type: STRING
    mode: NULLABLE
  - name: lon
    type: FLOAT64
    mode: NULLABLE
  - name: lat
    type: FLOAT64
    mode: NULLABLE
  - name: userId
    type: INTEGER
    mode: NULLABLE
  - name: lastName
    type: STRING
    mode: NULLABLE
  - name: firstName
    type: STRING
    mode: NULLABLE
  - name: gender
    type: STRING
    mode: NULLABLE
  - name: dateOfBirth
    type: STRING
    mode: NULLABLE
  - name: registration
    type: INTEGER
    mode: NULLABLE
  - name: device
    type: STRING
    mode: NULLABLE
  - name: os
    type: STRING
    mode: NULLABLE
  - name: success
    type: BOOLEAN
    mode: NULLABLE

